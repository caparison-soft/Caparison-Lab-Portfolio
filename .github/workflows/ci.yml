name: CI

# Every push and pull request: install, generate the Prisma client, lint and
# type-check. Deploys are Vercel's job (its GitHub integration builds every
# push to main and previews every pull request); this keeps broken code from
# reaching it. No database is needed here.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
