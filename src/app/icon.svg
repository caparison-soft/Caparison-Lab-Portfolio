<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Favicon (owner, 2026-09-17). One colour, no plate, no media query.
    Chrome does not apply prefers-color-scheme inside a favicon, so an
    adaptive SVG showed its light-scheme colour on a dark tab bar and the
    mark vanished. Lime is the brand's signal colour and is the one value
    that reads on a white tab bar and a near-black one alike, so the icon
    simply does not need to adapt. favicon.ico is rasterised from this same
    file, so whichever the browser picks it is the same mark.
    The shape is the brand's simplified single-colour hex: a solid hexagon
    with the spark knocked out, because the circular aperture closes up
    at 16px.
  -->
  <defs>
    <mask id="spark">
      <rect width="100" height="100" fill="#FFFFFF"/>
      <path d="M50 29 C52.6 42.6 57.4 47.4 71 50 C57.4 52.6 52.6 57.4 50 71 C47.4 57.4 42.6 52.6 29 50 C42.6 47.4 47.4 42.6 50 29 Z" fill="#000000"/>
    </mask>
  </defs>
  <polygon points="50,8 86,29 86,71 50,92 14,71 14,29"
           fill="#D6F631" stroke="#D6F631"
           stroke-width="9" stroke-linejoin="round" mask="url(#spark)"/>
</svg>
