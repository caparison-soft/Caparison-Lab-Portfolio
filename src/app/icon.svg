<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Adaptive favicon (owner, 2026-09-17): no plate behind it, the mark simply
    inverts. Ink on a light tab bar, bone on a dark one. An SVG favicon may
    carry its own stylesheet, and browsers evaluate prefers-color-scheme in it,
    which is the only way a favicon can answer the tab colour.
    The shape is the brand's simplified single-colour hex, which is what the
    guide calls for below its full-colour floor: a solid hexagon with the spark
    knocked out, because the circular aperture closes up at 16px.
  -->
  <style>
    .mark { fill: #000000; stroke: #000000; }
    @media (prefers-color-scheme: dark) { .mark { fill: #ECEEE8; stroke: #ECEEE8; } }
  </style>
  <defs>
    <mask id="spark">
      <rect width="100" height="100" fill="#FFFFFF"/>
      <path d="M50 29 C52.6 42.6 57.4 47.4 71 50 C57.4 52.6 52.6 57.4 50 71 C47.4 57.4 42.6 52.6 29 50 C42.6 47.4 47.4 42.6 50 29 Z" fill="#000000"/>
    </mask>
  </defs>
  <polygon class="mark" points="50,8 86,29 86,71 50,92 14,71 14,29"
           stroke-width="9" stroke-linejoin="round" mask="url(#spark)"/>
</svg>
